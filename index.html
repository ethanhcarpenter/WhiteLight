    <link rel="stylesheet" href="src/styles/index.css">
</head>
<body>

    <nav class="sidebar">
        <!-- Logo in a light rounded container -->
        <div class="logo-container">
            <a href="src/pages/home.html" target="content-frame">
                <img src="assets/img/logo.png" alt="Logo" class="logo">
            </a>
        </div>


        <!-- Links in their own container for spacing -->
        <div class="nav-links">
            <a href="src/pages/jjk.html" target="content-frame">JJK</a>
            <a href="src/pages/whitelight.html" target="content-frame">White Light</a>
            <a href="src/pages/mrmen.html" target="content-frame">Mr Men</a>

            <a href="src/pages/home.html" target="content-frame">to be decided</a>
        </div>


        <div class="turntable-wrap">
            <div class="track-name-container">
                <div id="trackName" class="track-name-scroll">Select a Track</div>
            </div>
                <button class="close-btn" id="closeBtn" aria-label="Close Player">✕</button>
                <div class="platter-outer" id="platterOuter">
                    <div class="platter-label" id="platterLabel">
                        <div class="platter-center"></div>
                    </div>
                </div>
                <div class="turntable-controls">
                    <button class="ctrl-btn" id="prevBtn" aria-label="Previous album">&#8592;</button>
                    <button class="ctrl-btn" id="playBtn" aria-label="Play album">&#9208;</button>
                    <button class="ctrl-btn" id="nextBtn" aria-label="Next album">&#8594;</button>
                </div>

                <div class="volume-container">
                    <span class="vol-icon">&#128266;</span>
                    <input type="range" id="volumeSlider" min="0" max="100" value="30">
                </div>
            </div>

        
        <a href="src/pages/chat.html" target="content-frame" class="chat-link">Chat</a>
    </nav>

    <main class="window-container">
        <iframe 
            name="content-frame" 
            src="src/pages/home.html" 
            frameborder="0">
        </iframe>
    </main>

    <script src="src/scripts/index.js"></script>
