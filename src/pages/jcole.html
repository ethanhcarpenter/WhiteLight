<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J. Cole Discography | Interactive Shelf</title>
    
    <link rel="stylesheet" href="../../src/styles/jcole.css">
</head>
<body>

    <main class="jc-root" id="root">
        
        <header class="crate-label">
            J. Cole — Discography
        </header>

        <section class="shelf-row" id="shelf">
            <div class="shelf-line"></div>
        </section>

        <p class="hint-text" id="hint">pull a record from the shelf</p>

        <section class="player-section" id="playerSection">
            </div>

            <article class="tracklist">
                <h1 class="album-name" id="albumName">—</h1>
                <p class="year-tag" id="albumYear"></p>
                <div id="trackList"></div>
            </article>
        </section>

        <div class="picked-overlay" id="overlay"></div>

    </main>

    <script src="../../src/scripts/jcole.js"></script>
    <script>
        let wakeLock = null;
        async function activateWakeLock() {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('PC will stay awake!');
            } catch (err) {
                console.log('Wake Lock failed. Is the tab active?');
            }
        }

        // Re-activate if user switches back to the tab
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                activateWakeLock();
            }
        });
    </script>
</body>
</html>
