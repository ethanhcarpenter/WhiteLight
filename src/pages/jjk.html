<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/jjk.css">
</head>
<body>

    <div class="video-controls">
        <h3 id="version-title">JJK : Loading...</h3>
        
        <div class="controls-group">
            <!-- Dynamically filled by JS -->
            <select id="video-selector" onchange="updatePlayer()"></select>

            <a id="download-link" href="#" download class="btn-download">
                Download MP4
            </a>
        </div>
    </div>

    <div class="video-viewport">
        <video id="main-video" controls muted>
            Your browser does not support the video tag.
        </video>
    </div>

    <script src="../scripts/jjk.js"></script>
</body>
</html>
